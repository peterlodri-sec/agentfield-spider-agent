# Local-mode runtime. Joins my-agent_default so the agent can reach the
# compose control-plane at http://control-plane:8080. Bundles a redis
# sidecar (production assumes external Redis via REDIS_URL).

services:
  spider-agent:
    build: .
    env_file: .env
    environment:
      AGENT_CALLBACK_URL: http://spider-agent:8005
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - my-agent_default
    ports:
      - "8005:8005"
    restart: unless-stopped
    # SIGTERM → app.run() exits → try/finally logs "stopped". 30s
    # gives the AgentField runner time to unregister cleanly.
    stop_grace_period: 30s

  spider-http:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: python spider_server.py
    depends_on:
      - redis
    networks:
      - my-agent_default
    ports:
      - "11700:11700"
    restart: unless-stopped
    # 30s for aiohttp cleanup chain (cancel tasks → close browser →
    # close redis → close http). Each step has a per-step timeout in
    # spider_server.py:_on_cleanup; total target ≤20s, the extra
    # margin keeps a slow Chromium child from triggering SIGKILL.
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    networks:
      - my-agent_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Redis flushes its AOF / saves on SIGTERM; 15s is generous.
    stop_grace_period: 15s

  # ─── Lightpanda CDP server (BETA browser backend) ──────────────────
  # Opt-in. Activate with `docker compose --profile lightpanda up`. To
  # make spider-agent USE it, set BROWSER_BACKEND=lightpanda in .env
  # (or pass `browser: lightpanda` on the /fetch/sync payload per-call).
  #
  # The container is tiny (~30 MB) — leaving it always-on is fine.
  # We gate behind a profile only so users who don't care about the
  # alternate backend don't have an extra service running.
  lightpanda:
    build:
      context: .
      dockerfile: Dockerfile.lightpanda
    profiles:
      - lightpanda
    networks:
      - my-agent_default
    ports:
      - "9222:9222"
    restart: unless-stopped
    healthcheck:
      # Lightpanda's CDP root serves /json/version with a JSON body
      # listing the protocol version. If this works, the browser is up.
      test:
        - "CMD-SHELL"
        - "wget -q -O- http://localhost:9222/json/version > /dev/null"
      interval: 15s
      timeout: 3s
      retries: 3
    stop_grace_period: 10s

networks:
  my-agent_default:
    external: true
