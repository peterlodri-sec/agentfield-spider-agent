# Copy to secret.yaml and fill in real values, then `kubectl apply -f`.
# secret.yaml is gitignored.
#
# v1 of agentfield-spider-agent doesn't require any secrets — the HTTP
# surface is unauthenticated (intended to be reached only via the
# ClusterIP service, not exposed externally). This file exists so the
# Deployment's `envFrom: - secretRef: { name: spider-secrets, optional: true }`
# resolves cleanly if you add credentials later (e.g. when you wire in
# bearer auth on /fetch).
apiVersion: v1
kind: Secret
metadata:
  name: spider-secrets
  labels:
    app: spider-agent
type: Opaque
stringData: {}
