apiVersion: v1
kind: Service
metadata:
  name: spider-agent
  labels:
    app: spider-agent
spec:
  type: ClusterIP
  selector:
    app: spider-agent
  ports:
  - name: agent
    port: 8005
    targetPort: agent
    protocol: TCP
  - name: http
    port: 11700
    targetPort: http
    protocol: TCP
