name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Verify imports compile
        run: uv run python -m py_compile main.py spider_server.py reasoners/*.py spider/*.py

      - name: Mypy
        run: uv run mypy spider/ main.py spider_server.py reasoners/

      - name: Compose syntax
        run: cp .env.example .env && docker compose config > /dev/null

  test:
    name: test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      # Fast fail: bootstrap imports + /health readiness contract.
      - name: Smoke
        run: uv run pytest tests/test_smoke.py -q --tb=line --no-header

      # Core: fetch pipeline, security, dispatch, sessions/evasion, HTTP routes.
      - name: Core
        run: |
          uv run pytest \
            tests/test_security.py \
            tests/test_dispatch.py \
            tests/test_fetch_errors.py \
            tests/test_errors.py \
            tests/test_evasion.py \
            tests/test_sessions.py \
            tests/test_state.py \
            tests/test_queue.py \
            tests/test_politeness.py \
            tests/test_proxy.py \
            tests/test_fetchers_github.py \
            tests/test_fetchers_hn.py \
            tests/test_fetchers_reddit.py \
            tests/test_spider_skill.py \
            tests/test_routes.py \
            tests/test_crawl.py \
            tests/test_crawl_dispatcher.py \
            -q --tb=short -ra

      # Extended: optional backends, sinks, feeds, profiles, parsers.
      - name: Extended
        run: |
          uv run pytest \
            tests/test_browsers.py \
            tests/test_chroma_sink.py \
            tests/test_docling_parser.py \
            tests/test_extract.py \
            tests/test_feeds.py \
            tests/test_profiles.py \
            tests/test_sitemap.py \
            -q --tb=short -ra

  # Main image build via Docker Buildx Cloud.
  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test
    environment: main
    timeout-minutes: 30
    env:
      DOCKER_USER: ${{ github.event_name == 'pull_request' && 'localbuild' || secrets.DOCKER_USER || vars.DOCKER_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx (cloud)
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "60ph3r/main-gh-builder-joe"

      - name: Set up Docker Buildx (local PR fallback)
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      # Trim DOCKER_USER: a trailing newline in the environment secret turns the
      # multiline ``tags`` input into four lines (user + /image:tag), which makes
      # buildx fail with ``invalid tag "/agentfield-spider-agent:latest"``.
      - name: Docker image tags
        id: docker_tags
        env:
          DOCKER_USER: ${{ env.DOCKER_USER }}
        run: |
          user="${DOCKER_USER//$'\r'/}"
          user="${user//$'\n'/}"
          if [ -z "$user" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              user="localbuild"
            else
              echo "::error::DOCKER_USER is empty in the main environment"
              exit 1
            fi
          fi
          {
            echo "tags<<EOF"
            echo "${user}/agentfield-spider-agent:latest"
            echo "${user}/agentfield-spider-agent:sha-${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          tags: ${{ steps.docker_tags.outputs.tags }}
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}

  # Docling-enabled image build (main pushes only).
  docker-docling:
    name: docker-docling
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: main
    timeout-minutes: 60
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USER || vars.DOCKER_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "60ph3r/main-gh-builder-joe"

      - name: Build and push Docling image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            INSTALL_DOCLING=1
          tags: |
            ${{ env.DOCKER_USER }}/agentfield-spider-agent:docling-latest
            ${{ env.DOCKER_USER }}/agentfield-spider-agent:docling-${{ github.sha }}
          outputs: type=registry
          cache-from: type=gha
          cache-to: type=gha,mode=max
